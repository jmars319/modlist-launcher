name: Release

# Builds the portable zip and the per-user installer for a version tag and
# attaches them, with checksums, to a draft GitHub release for review.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/*.zip dist/*.exe dist/SHA256SUMS.txt --draft --title "Modlist Launcher $env:GITHUB_REF_NAME" --generate-notes
