name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build
    # GitHub-hosted on purpose: this repository is public, and self-hosted
    # runners must not run code from pull requests.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked -p modlist-launcher

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = Get-Item target/release/modlist-launcher.exe
          "modlist-launcher.exe: {0:N1} MB" -f ($exe.Length / 1MB) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The smoke tests drive the release build's real window (screenshots and
      # UI Automation) against throwaway data; the hosted runner's desktop
      # session makes that possible.
      - name: Smoke test, repaint after minimize and restore
        shell: pwsh
        run: ./scripts/smoke-minimize-restore.ps1

      - name: Smoke test, arrow keys between cards
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/smoke-arrow-keys.ps1

      - name: Collect smoke screenshots
        if: failure()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem ([IO.Path]::GetTempPath()) -Directory -Filter 'modlist-*' |
              ForEach-Object { Copy-Item $_.FullName (Join-Path $out $_.Name) -Recurse }

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
