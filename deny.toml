[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # pin-utils is unmaintained, not vulnerable. It is reached only at compile
    # time, through Slint's spin_on (slint-build, slint-macros), and is not in
    # the shipped exe. Slint 1.18.1 is the newest release. Expires 2027-02-08;
    # recorded in agentic-instructions docs/security-advisory-decisions.md.
    { id = "RUSTSEC-2026-0441", reason = "compile-time only via Slint's spin_on; no upgrade; expires 2027-02-08" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# The launcher has no network access by design; keep HTTP and TLS stacks out.
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "isahc" },
    { crate = "openssl" },
    { crate = "native-tls" },
    { crate = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
